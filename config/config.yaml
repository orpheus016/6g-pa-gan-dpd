# =============================================================================
# 6G PA GAN-DPD Configuration
# CWGAN-GP with QAT for Memory-Aware TDNN Generator
# =============================================================================

# -----------------------------------------------------------------------------
# System Parameters
# -----------------------------------------------------------------------------
system:
  sample_rate: 800000000           # 800 MHz sample rate (dpa_200mhz dataset)
  target_rate: 250000000           # 250 MHz target for 6G (2× interpolation)
  bandwidth: 200000000             # 200 MHz channel bandwidth
  
# -----------------------------------------------------------------------------
# PA Parameters (GaN Digital Twin)
# -----------------------------------------------------------------------------
pa:
  type: "volterra"             # PA model type: volterra, saleh, rapp
  memory_depth: 3              # Memory depth (taps)
  nonlinear_order: 7           # Nonlinearity order
  gain_db: 30                  # Small-signal gain (dB)
  p1db_dbm: 40                 # 1dB compression point (dBm)
  
  # Temperature coefficients (thermal drift)
  thermal:
    cold:
      temp_celsius: 0
      gain_drift: -0.02        # -2% gain change
      phase_drift: -5          # -5 degree phase change
      am_am_coeff: 1.05        # AM-AM coefficient scaling
    normal:
      temp_celsius: 25
      gain_drift: 0.0
      phase_drift: 0
      am_am_coeff: 1.0
    hot:
      temp_celsius: 70
      gain_drift: -0.05        # -5% gain change
      phase_drift: 10          # +10 degree phase change
      am_am_coeff: 0.92        # AM-AM coefficient scaling
      
  # Noise parameters
  noise:
    floor_db: -60              # Noise floor (dB)
    phase_noise_deg: 0.5       # Phase noise RMS (degrees)

# -----------------------------------------------------------------------------
# DPD Model Architecture (Memory-Aware TDNN)
# -----------------------------------------------------------------------------
model:
  # Generator: Phase-Normalized TDNN (PN-TDNN)
  generator:
    type: "pn-tdnn"            # Phase-Normalized Time-Delay Neural Network
    memory_depth: 3            # M=3 (captures >95% GaN PA memory)
    
    # Input structure (24-dimensional):
    # 6 features (I, Q, |z|, |z|^2, |z|^3, phase) × 4 taps (M+1) = 24 dims
    input_dim: 24
    
    # Network architecture (24 → 32 → 16 → 2)
    hidden_dims: [32, 16]      # FC layers
    output_dim: 2              # I_dpd, Q_dpd
    
    # Activation functions
    hidden_activation: "leaky_relu"
    leaky_slope: 0.2
    output_activation: "linear"   # Linear output (phase denorm bounds naturally)
    
    # Regularization
    dropout: 0.0               # No dropout for inference
    batch_norm: false          # No BN for FPGA simplicity
    
  # Discriminator: Conditional WGAN-GP Critic
  discriminator:
    type: "mlp"
    input_dim: 4               # 2 (output) + 2 (condition)
    hidden_dims: [64, 32]      # FC layers (matches notebook)
    output_dim: 1              # Wasserstein score
    
    hidden_activation: "leaky_relu"
    leaky_slope: 0.2
    use_spectral_norm: false   # Not used in CWGAN-GP

# -----------------------------------------------------------------------------
# Quantization (QAT - Quantization-Aware Training)
# -----------------------------------------------------------------------------
quantization:
  enabled: true
  
  # Weight quantization
  weight:
    bits: 16                   # Q1.15 format
    signed: true
    per_channel: true          # Per-channel scale factors
    symmetric: true
    
  # Activation quantization  
  activation:
    bits: 16                   # Q8.8 format
    signed: true
    per_tensor: true
    symmetric: false           # Asymmetric for ReLU
    
  # Accumulator
  accumulator:
    bits: 32                   # Q16.16 format
    
  # QAT schedule
  qat:
    start_epoch: 300            # Start QAT after initial training
    warmup_epochs: 10          # Gradual quantization warmup
    
# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  # Basic settings
  batch_size: 64               # Matches notebook configuration
  epochs: 500
  
  # Optimizer
  optimizer:
    type: "adam"
    lr_generator: 1e-4
    lr_discriminator: 1e-4
    betas: [0.0, 0.9]          # WGAN-GP: no momentum
    weight_decay: 1e-5
    
  # CWGAN-GP settings
  n_critic: 5                  # Train D 5x per G update
  gp_weight: 10.0              # Gradient penalty weight
  
  # Loss weights
  loss:
    adversarial: 1.0           # Wasserstein loss weight
    reconstruction_l1: 50.0    # L1 loss weight
    spectral: 10.0             # Spectral loss weight (combined EVM+ACPR)
    
  # Learning rate schedule
  scheduler:
    type: "cosine"
    min_lr: 1e-6
    warmup_epochs: 0           # No warmup (starts immediately)
    
  # Early stopping configuration
  early_stopping:
    enabled: true
    patience: 25               # Stop if no improvement for 25 epochs
    monitor: "val_evm_db"      # Metric to monitor
    min_delta: 0.01            # Minimum improvement (0.01 dB for EVM)
    restore_best_weights: true # Restore best model at end
    
  # Checkpointing
  checkpoint_interval: 25
  save_best: true
  best_metric: "evm"           # Save best based on EVM

# -----------------------------------------------------------------------------
# Spectral Loss Configuration (EVM, ACLR, NMSE)
# For dpa_200mhz: 1 channel, 10 sub-channels, 800 MSps
# -----------------------------------------------------------------------------
spectral_loss:
  # Main channel configuration
  bw_main_ch: 200000000        # Main channel bandwidth 200 MHz (dpa_200mhz)
  
  # Sub-channel analysis
  n_sub_ch: 10                 # 10 sub-channels for EVM/ACLR analysis (dpa_200mhz)
  
  # FFT parameters
  nperseg: 2560                # FFT segment length for Welch PSD
  
  # Metrics thresholds
  targets:
    evm_db: -45                # Target EVM: < -45 dB
    aclr_db: -62               # Target ACLR: < -62 dBc
    nmse_db: -42               # Target NMSE: < -42 dB

# -----------------------------------------------------------------------------
# Dataset Configuration
# Current: dpa_200mhz (1 channel, 10 sub-channels, 800 MSps)
# Previous: apa_200mhz (5 channels, 1 sub-channel, 250 MSps)
# -----------------------------------------------------------------------------
dataset:
  name: "DPA_200MHz"           # Dataset name (matches data directory)
  n_channels: 1                # 1 channel for dpa_200mhz
  n_sub_channels: 10           # 10 frequency sub-channels
  sample_rate: 800000000       # 800 MSps sampling

# Data Configuration
# 
data:
  # OpenDPD DPA dataset
  dataset_path: "data/DPA_200MHz/raw/"
  processed_path: "data/DPA_200MHz/processed/"
  
  # Data split
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  
  # Normalization
  normalize: true
  clip_range: [-1.0, 1.0]
  
  # Augmentation
  augmentation:
    enabled: true
    noise_injection: true
    noise_std: 0.01
    
# -----------------------------------------------------------------------------
# A-SPSA Online Adaptation (FPGA parameters)
# -----------------------------------------------------------------------------
aspsa:
  # Initial learning rate (Q0.16 format)
  initial_lr: 0.01             # a0
  initial_perturbation: 0.001  # c0
  
  # Annealing schedule
  anneal_period: 1000          # Iterations per anneal step
  anneal_shift: 1              # Bits to shift (divide by 2)
  max_anneal_steps: 8          # Maximum anneal steps
  
  # Convergence
  min_lr: 1e-6
  convergence_threshold: 1e-4
  
  # LFSR for Bernoulli perturbation
  lfsr_seed: 0xACE1
  lfsr_taps: [15, 14, 12, 3]   # 16-bit LFSR taps

# -----------------------------------------------------------------------------
# FPGA Deployment
# -----------------------------------------------------------------------------
fpga:
  target: "zcu104"             # Target board: pynq_z1, zcu104
  
  # Clock domains
  nn_clock_mhz: 200            # NN inference clock
  spsa_clock_mhz: 1            # A-SPSA update clock
  dac_clock_mhz: 400           # Output DAC clock (2× interpolation)
  
  # Memory configuration
  weight_banks: 3              # Cold/Normal/Hot weight banks
  bram_depth: 2048             # BRAM depth per bank
  
  # CDC configuration
  cdc_sync_stages: 2           # Number of synchronizer stages
  shadow_buffer_depth: 512     # Shadow memory depth
  
  # Temperature thresholds
  temp_cold_threshold: 15      # °C
  temp_hot_threshold: 40       # °C

# -----------------------------------------------------------------------------
# Export Configuration
# -----------------------------------------------------------------------------
export:
  output_dir: "export/"
  
  # Weight file format
  format: "binary"             # binary, hex, coe
  endianness: "little"
  
  # Files to generate
  files:
    - "weights_cold.bin"
    - "weights_normal.bin"
    - "weights_hot.bin"
    - "bias_cold.bin"
    - "bias_normal.bin"
    - "bias_hot.bin"
    - "tanh_lut.bin"
    
# -----------------------------------------------------------------------------
# Logging & Visualization
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  tensorboard: true
  wandb: false
  log_interval: 100            # Log every N batches
  
visualization:
  plot_interval: 10            # Plot every N epochs (matches notebook: every 10 epochs)
  metrics:
    - "evm"
    - "acpr"
    - "nmse"
    - "constellation"
